# docker-compose.yml — Entwicklungsumgebung
#
# Zielstruktur (siehe .opencode/shared/workspace.md):
#   backend/   (Django + Clean Architecture, dsmarti-Settings)
#   apps/parent (Eltern-Portal, Vite + React)
#   apps/kids   (Kinder-Lern-App, Vite + React)
#
# Hinweis: Die Frontend-Services (apps/parent, apps/kids) bauen erst,
# sobald die Apps als Vite-Projekte angelegt sind (Dockerfile + src/).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarti_dev
      POSTGRES_USER: smarti
      POSTGRES_PASSWORD: smarti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarti -d smarti_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    command: uv run python -m dweb.manage runserver 0.0.0.0:8000
    volumes:
      - ./backend/src:/app/backend/src
    ports:
      - "8000:8000"
    environment:
      DEBUG: "${DEBUG:-True}"
      # DATABASE_URL bewusst NICHT interpoliert — im Container- Netz heisst der Host `db`,
      # nicht `localhost` (wie in der Root-.env). Siehe Hinweis oben.
      DATABASE_URL: postgresql://smarti:smarti@db:5432/smarti_dev
      SECRET_KEY: "${SECRET_KEY:-dev-only-not-for-production}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}"
      DJANGO_SETTINGS_MODULE: "${DJANGO_SETTINGS_MODULE:-dsmarti.settings}"
      PYTHONPATH: /app/backend/src
      # Object Storage (R2_*) — nur relevant, wenn Production-Settings aktiv sind
      # (dsmarti.settings_production); Dev-Settings (dsmarti.settings) lesen diese nicht.
      R2_ENDPOINT_URL: "${R2_ENDPOINT_URL:-http://minio:9000}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-smarti}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-smarti123}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-smarti-bucket}"
      R2_REGION_NAME: "${R2_REGION_NAME:-us-east-1}"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  parent:
    build:
      context: .
      dockerfile: apps/parent/Dockerfile
      target: builder
    command: npm run dev --workspace=apps/parent
    volumes:
      - ./apps/parent/index.html:/app/apps/parent/index.html
      - ./apps/parent/public:/app/apps/parent/public
      - ./apps/parent/src:/app/apps/parent/src
      - ./packages:/app/packages
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  kids:
    build:
      context: .
      dockerfile: apps/kids/Dockerfile
      target: builder
    command: npm run dev --workspace=apps/kids
    volumes:
      - ./apps/kids/index.html:/app/apps/kids/index.html
      - ./apps/kids/public:/app/apps/kids/public
      - ./apps/kids/src:/app/apps/kids/src
      - ./packages:/app/packages
    ports:
      - "8081:8080"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: smarti
      MINIO_ROOT_PASSWORD: smarti123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
